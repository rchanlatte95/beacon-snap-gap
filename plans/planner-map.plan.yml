  "pivot_guidance": [
    "SLICE-1 runs as ordered CONTRACTS, RED, GREEN batches of one or two behaviors each: first the Build output and flag rule (REQ-9, REQ-1 and the manifest sequencing specs SEQ-1 and SEQ-2), then the map (SEQ-3, REQ-7, REQ-10), then the tract card (SEQ-4, REQ-8, REQ-3, REQ-5).",
    "No contract, test or production code begins until the human explicitly approves this plan and the manifest.",
    "clauses_in_scope is empty on purpose: contract clauses do not exist yet. Add each batch's clause IDs when that batch begins (FM-6).",
    "The plan is written against manifest_hash. Any manifest change fails the drift check: re-read the manifest, update this file, then continue.",
