# Minimal static server for Cloud Run. One worker keeps memory low.
# Cloud Run sends traffic to port 8080 by default; keep the service on that default.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # The page and the data change on every deploy: browsers must check before reusing them,
        # or an old page meets new data and shows "The map data did not load".
        location / {
            add_header Cache-Control "no-cache" always;
        }

        location ~ \.(json|geojson)$ {
            types {
                application/json json;
                application/geo+json geojson;
            }
            add_header Cache-Control "no-cache" always;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        # nginx/start.sh replaces the next line with the /api/ask route to QUERY_SERVICE_URL.
        #@QUERY_SERVICE_ROUTE@

    }
}
